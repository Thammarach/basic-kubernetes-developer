apiVersion: apps/v1
kind: DaemonSet
# DaemonSet เป็นการสร้าง Pods โดยให้กระจายไปทุก Nodes ที่มีใน cluster
# ต่างจาก Deployment ที่สนใจแค่จำนวน Pods ที่ต่องการสร้าง
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      containers:
        - name: node-exporter
          image: prom/node-exporter:latest
          resources:
            requests:
              memory: "200Mi"
              cpu: "100m"
            limits:
              memory: "300Mi"
              cpu: "200m"
          ports:
            - containerPort: 9100
              name: metrics
          securityContext:
            privileged: true