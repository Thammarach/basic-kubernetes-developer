apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-service
  namespace: demok8s
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - host: kubernetes.docker.internal
    http:
      paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: server-service # ถ้าเรียกผ่าน /api จะให้ route มาที่ server-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-service # ถ้าเรียกผ่าน / จะให้ route มาที่ client-service
                port:
                  number: 80